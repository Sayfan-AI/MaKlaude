# Seed scenario (e): a SECOND Deployment wedged by a bad rollout — the fixable fault
# the SHIPPED BINARY remediates.
#
# It is a near-copy of wedged-deploy.yaml, and the duplication is the point rather
# than an oversight. Two tests in this suite drive an approved rollback to completion
# and each one needs a fault of its own:
#
#   - TestE2E_GatedRemediation (remediation_test.go) wires the packages together in
#     process and remediates `wedged`.
#   - TestE2E_BinaryTwoPassGatedRemediation (two_pass_binary_test.go) runs the
#     `maklaude remediate` BINARY as a subprocess, twice, with the approval arriving
#     between the two runs, and remediates this one.
#
# A remediation is not idempotent in the way sharing a target would need: once the
# first test rolls `wedged` back, the Deployment is healthy and the pipeline correctly
# proposes nothing at all, so the second test would have no fault to drive. Sharing
# also destroys the second test's central assertion — that exactly ONE mutating
# request landed, at the object a human approved — because it could no longer tell
# its own write from the sibling test's.
#
# # Why it is called `stuck` and not `wedged-binary`
#
# remediation_test.go's findingsAbout() matches "the remediated Deployment and the
# objects derived from it" by exact name OR the `wedged-` prefix, which is how it
# catches ReplicaSets and pods whose pod-template hash is not known ahead of time.
# A sibling named `wedged-binary` matches that prefix, so this Deployment being (by
# design) still broken while remediation_test.go asserts `wedged` came back healthy
# would fail that test for a fault it does not own. The name is load-bearing: it must
# not begin with "wedged-".
#
# Everything else — `strategy: Recreate`, one replica, busybox:1.36 as the known-good
# revision 1, the two-step wedge performed by the CI job — is there for the reasons
# wedged-deploy.yaml's header sets out at length. Read that file for the argument;
# this one exists to be a second instance of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stuck
  namespace: maklaude-e2e
  labels:
    app.kubernetes.io/part-of: maklaude-e2e
    scenario: stuck
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: maklaude-e2e
      scenario: stuck
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maklaude-e2e
        scenario: stuck
    spec:
      containers:
        - name: app
          # Revision 1: the known-good image the approved rollback restores.
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
