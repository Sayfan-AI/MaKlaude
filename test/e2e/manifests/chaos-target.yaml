# The workload MaKlaude's chaos lifecycle test breaks on purpose.
#
# It is its OWN namespace, separate from maklaude-e2e, and that separation is the
# point rather than tidiness. Every other scenario in this directory is a fault
# MaKlaude is meant to *detect and fix*, and their assertions are about convergence.
# A chaos experiment deliberately makes pods unavailable, so pointing one at the
# remediation scenarios would make one test's fault another test's flake — and the
# resulting failure would look like a remediation bug rather than a test that
# stepped on itself.
#
# The readiness probe is load-bearing, not hygiene. Chaos Mesh's `pod-failure`
# action makes a pod unavailable by swapping its containers onto a pause image; the
# container therefore still RUNS, and a pod with no probe would keep reporting Ready
# while its application is gone. An exec probe that needs a real userland fails
# under the pause image, which is what turns "the fault landed" into something a
# reader can observe from pod status rather than infer.
apiVersion: v1
kind: Namespace
metadata:
  name: maklaude-chaos-target
  labels:
    app.kubernetes.io/part-of: maklaude-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victim
  namespace: maklaude-chaos-target
  labels:
    app.kubernetes.io/part-of: maklaude-e2e
    scenario: chaos-target
spec:
  # Two replicas so a `mode: all` experiment has more than one object to affect and a
  # `mode: one` experiment demonstrably leaves the other alone. The chaos tests select
  # explicitly rather than relying on this count, but a single-replica target would let
  # a mode bug pass unnoticed.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/part-of: maklaude-e2e
      scenario: chaos-target
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: maklaude-e2e
        scenario: chaos-target
    spec:
      containers:
        - name: app
          # The same pinned image every other seed uses, so the node already holds it
          # and a killed pod comes back in seconds instead of waiting on a pull.
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep 3600"]
          readinessProbe:
            # Needs a real userland: present under busybox, absent under the pause
            # image Chaos Mesh substitutes for a pod-failure.
            exec:
              command: ["/bin/true"]
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
