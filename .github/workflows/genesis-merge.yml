name: Genesis Auto-Merge

# Trigger on the completion of EITHER gating workflow ("CI" fast + "E2E (kind)" slow),
# so whichever finishes LAST triggers a merge attempt. Listening only on "CI" was a trap:
# when CI finished first and fired this workflow, E2E was still pending so the merge was
# skipped; when E2E later went green NO event fired (it wasn't in the list), leaving the
# PR green-but-unmerged. This is safe because the merge agent independently verifies that
# ALL CI checks are passing before merging — triggering on either completion just
# guarantees a merge attempt happens after the last gate goes green, never on a red PR.

on:
  workflow_run:
    workflows: ["CI", "E2E (kind)"]
    types: [completed]

# Auto-merge gets its OWN group, NOT the orchestrator group. Sharing it meant a
# triage/orchestrator run already in the group would starve and cancel the
# Auto-Merge run that fires on a green PR — leaving the PR green but unmerged and
# the milestone stalled. Merges only need to serialize among themselves; a merge
# (server-side squash) running alongside an orchestrator is harmless.
concurrency:
  group: genesis-merge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    # Only run when CI succeeds on a PR
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GENESIS_APP_ID }}
          private-key: ${{ secrets.GENESIS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
          permission-actions: write

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "genesis-dev-bot[bot],dependabot[bot]"
          # Reaches the activity-logging hooks in .claude/settings.json. The
          # `settings` input MERGES with the repo's settings, so the hooks survive.
          # Unset secrets render as empty strings and log.sh falls back to stderr.
          settings: |
            {
              "env": {
                "GENESIS_LOKI_URL": "${{ secrets.GENESIS_LOKI_URL }}",
                "GENESIS_LOKI_USER": "${{ secrets.GENESIS_LOKI_USER }}",
                "GENESIS_LOKI_TOKEN": "${{ secrets.GENESIS_LOKI_TOKEN }}"
              }
            }
          # Bot-only merge is a DELIBERATE decision, not an oversight (#81).
          # This repo is public, so `pull_request` events fire for fork PRs from
          # anyone. Auto-merging "any green PR" would let an arbitrary
          # contributor land code on main with no human in the loop — exactly the
          # least-privilege line MaKlaude itself is built around. Restricting to
          # PRs the dev system authored keeps the trust boundary crisp.
          #
          # The consequence, accepted: a HUMAN-authored PR is not auto-merged. It
          # is merged by the orchestrator on its next run (event-triggered on the
          # PR, or the scheduled tick) after it verifies the checks are green —
          # see "Dev system" in CLAUDE.md for the full policy. The
          # event-triggered path is what stalled #79 green-but-unmerged, because
          # that run died at max-turns; that budget is now 40 (#81).
          prompt: |
            CI just passed on a PR. Check if there are any open PRs created by genesis-dev-bot
            where all CI checks have passed. If so, merge them.

            Rules:
            - Only merge PRs created by genesis-dev-bot[bot]. Human-authored PRs are
              intentionally out of scope here — the orchestrator merges those. Leave them alone.
            - All CI checks must be passing
            - Use squash merge
            - After merging, close the corresponding task issue if one exists
            Do NOT trigger any workflow yourself — a deterministic step after you handles that.
          claude_args: "--max-turns 15 --allowedTools Bash,Read,Glob,Grep"

      # Deterministic re-trigger: guarantees the orchestrator wakes even if the
      # merge agent above hit max-turns or errored. Runs regardless of outcome.
      # Needs actions:write (workflow_dispatch) + contents:read (ref resolution).
      #
      # Dispatched via dispatch.sh, which retries before failing: because this
      # step is load-bearing its failure fails the job and trips escalate.sh, so
      # a single transient 502 used to manufacture a needs:human gate about
      # nothing (#88/#91). Semantics after retries are exhausted: still fail —
      # a just-merged PR wants prompt follow-up, and a dispatch that cannot be
      # delivered at all means only the 6-hourly tick will pick the work up.
      - name: Re-trigger orchestrator
        if: always()
        run: bash .genesis/scripts/dispatch.sh genesis-orchestrator.yml main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}

      # Escalate a real merge-run failure to a human (only on job failure).
      - name: Escalate on failure
        if: failure()
        run: bash .genesis/scripts/escalate.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          WF_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
