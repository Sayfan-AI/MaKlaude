name: Genesis Push Trigger

on:
  push:
    branches: [main]

jobs:
  trigger-orchestrator:
    runs-on: ubuntu-latest
    if: github.actor != 'genesis-dev-bot[bot]'
    steps:
      # Only for .genesis/scripts/dispatch.sh — no product code is needed here.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .genesis/scripts

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GENESIS_APP_ID }}
          private-key: ${{ secrets.GENESIS_APP_PRIVATE_KEY }}
          permission-actions: write
          permission-contents: read

      # dispatch.sh pins --ref (so `gh` doesn't do a default-branch lookup that
      # needs repo metadata the actions-only token lacks) and retries transient
      # 5xx before failing. Semantics after retries are exhausted: fail, so an
      # orchestrator that genuinely never wakes is visible rather than silent.
      - name: Trigger orchestrator
        run: bash .genesis/scripts/dispatch.sh genesis-orchestrator.yml main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
