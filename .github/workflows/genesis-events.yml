name: Genesis Orchestrator (Events)

on:
  issues:
    # Deliberately NOT 'labeled': the bot labels issues constantly, and each
    # label event would fire a run that the bot-actor guard then skips — pure noise.
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  orchestrate:
    # Serialize all orchestrator activity across triggers (events, schedule,
    # merge) so two near-simultaneous events can't run two orchestrators and
    # duplicate work. Declared on the JOB, not the workflow, so the bot-actor
    # gate below is evaluated *before* the group is joined.
    #
    # Only one run per group may be pending; a newer arrival cancels the older
    # pending one. At workflow level the group is joined before any `if:` runs, so
    # the bot-authored events this job exists to ignore still took the single
    # pending slot and evicted real ones. Over the repo's history that is 132
    # cancelled runs against 12 successes — and because a run cancelled while
    # pending starts no job, none of the 132 could trip the `if: failure()`
    # escalation below. Bot events outnumber human ones heavily here (a merge alone
    # fires issues + issue_comment + pull_request), so the eviction was near
    # constant. With the group here, a bot-triggered run skips in ~1s without ever
    # queueing.
    concurrency:
      group: genesis-orchestrator-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Skip events from bots to prevent loops
    if: github.actor != 'github-actions[bot]' && github.actor != 'genesis-dev-bot[bot]' && github.actor != 'claude[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GENESIS_APP_ID }}
          private-key: ${{ secrets.GENESIS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription OAuth token (`claude setup-token`), not an API key:
          # ANTHROPIC_API_KEY went invalid and 401'd every run for 3.5 days (#150).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: "genesis-dev-bot[bot]"
          # Reaches the activity-logging hooks in .claude/settings.json. The
          # `settings` input MERGES with the repo's settings, so the hooks survive.
          # Unset secrets render as empty strings and log.sh falls back to stderr.
          settings: |
            {
              "env": {
                "GENESIS_LOKI_URL": "${{ secrets.GENESIS_LOKI_URL }}",
                "GENESIS_LOKI_USER": "${{ secrets.GENESIS_LOKI_USER }}",
                "GENESIS_LOKI_TOKEN": "${{ secrets.GENESIS_LOKI_TOKEN }}"
              }
            }
          prompt: |
            Run the orchestrator agent defined in .claude/agents/orchestrator.md.

            An event triggered this run:
            - Event: ${{ github.event_name }} / ${{ github.event.action }}

            Assess this event in context of the project state and take appropriate action.

            FIRST, as soon as you know what you intend to do this run (right after
            assessing the event, before any implementation), record it:
              bash .genesis/scripts/checkpoint.sh "what I intend to do, and why"
            If this run later dies at max-turns, that checkpoint is the only record
            of your reasoning a human gets. One turn, before the unbounded work.
          # 60 matches the scheduled orchestrator: this runs the SAME agent
          # definition (.claude/agents/orchestrator.md), just on a different
          # trigger, and an event usually arrives with MORE attached context
          # than a cron tick (an issue plus a PR to review, merge and close).
          # 20 was the tightest budget of any Claude-invoking workflow here and
          # it died `error_max_turns` at turn 21 while working #78 + PR #79 —
          # no progress, no diagnosis, just the safety-net escalation (#80).
          # Raised to 40 with the class in #89, and to 60 in #96 when 45 was
          # observed to fail too — not in response to a failure here, because
          # the point of a class floor is that a runner should not have to die
          # first to earn a workable budget. See #81, #89, #96. Floor enforced
          # by test/devsystem/workflows_test.go.
          claude_args: "--max-turns 60 --allowedTools Read,Write,Edit,Bash,Glob,Grep,Agent"

      # Copy this run's transcript (reasoning + tool calls) off the runner
      # before it is torn down, and BEFORE the escalation below, which renders
      # the retention status. `always()`: a dying run's transcript is the one
      # that matters most, and a healthy run's is the baseline it is read
      # against. Sink is private Loki — `show_full_output` deliberately stays
      # off, because run logs and artifacts are world-readable on this public
      # repo. See #106 and .genesis/scripts/retain-transcript.sh.
      - name: Retain agent transcript
        if: always()
        run: bash .genesis/scripts/retain-transcript.sh
        env:
          GENESIS_LOKI_URL: ${{ secrets.GENESIS_LOKI_URL }}
          GENESIS_LOKI_USER: ${{ secrets.GENESIS_LOKI_USER }}
          GENESIS_LOKI_TOKEN: ${{ secrets.GENESIS_LOKI_TOKEN }}

      # Escalate a real run failure to a human. Runs only on job failure — no
      # separate watcher workflow, so it adds zero skipped runs to the Actions tab.
      - name: Escalate on failure
        if: failure()
        run: bash .genesis/scripts/escalate.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          WF_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
