# MaKlaude's OPTIONAL chaos RBAC bundle (Milestone 6).
#
# It is a sibling of deploy/rbac and deploy/rbac/write, and neither of those
# references it. You get an identity that can create chaos experiments only by
# naming this directory:
#
#   kubectl apply -k deploy/rbac         # required first: reads + the maklaude SA
#   kubectl apply -k deploy/rbac/write   # optional: approved remediation
#   kubectl apply -k deploy/rbac/chaos   # optional: deliberate experiments
#
# Unlike the write bundle, this one does NOT depend on the base bundle's
# ClusterRole — the chaos identity gets no reads outside its own custom resources —
# but it does expect the `maklaude` namespace to exist, which the base bundle
# creates.
#
# APPLYING THIS BUNDLE DOES NOT ENABLE CHAOS. Four independent gates have to be
# opened, by a person, in four different places:
#
#   1. this bundle (the API server will permit the CR write);
#   2. a per-cluster eligibility block in MaKlaude's cluster config, naming the
#      cluster and carrying the acknowledgement sentence verbatim — see
#      cluster.ChaosEligibility and docs/chaos.md. Absent, the cluster mints no
#      chaos capability and internal/chaos cannot be constructed for it at all;
#   3. kube.ExecuteMode set to something other than disabled, which is the same
#      kill switch approved remediation rides;
#   4. a per-target-namespace grant, one namespace at a time, via the two files in
#      this directory that are NOT listed below — target-namespace-role.yaml and
#      target-namespace-rolebinding.yaml. Chaos Mesh's permission-validation webhook
#      authorizes a create against the namespaces an experiment's SELECTOR names, so
#      without that grant every experiment is denied by admission even though this
#      bundle permits the write. They are excluded from `resources:` deliberately:
#      they have no namespace of their own, and which namespaces may be broken is not
#      a decision `kubectl apply -k` should make on an operator's behalf. See the
#      header of target-namespace-role.yaml for the exact check it satisfies.
#
# Any one of the four closes the path. Revoke the fastest one:
#
#   kubectl delete -k deploy/rbac/chaos              # the identity, cluster-wide
#   kubectl delete -f deploy/rbac/chaos/target-namespace-rolebinding.yaml -n <ns>
#                                                    # or just one namespace's turn
#
# It also does not install Chaos Mesh. MaKlaude writes the custom resources; Chaos
# Mesh's controller is what acts on them, and installing it — and choosing how
# widely it is scoped — is the operator's decision. See docs/chaos.md for what
# MaKlaude assumes about that installation, including the permission-validation
# tension worth knowing about before you enable it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
