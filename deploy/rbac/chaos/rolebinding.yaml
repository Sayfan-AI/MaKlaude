# Grants the maklaude-chaos ServiceAccount its three verbs, in one namespace.
#
# This binding — and only this binding — is what makes any chaos experiment
# possible at the API server. Deleting it revokes MaKlaude's ability to break
# anything while leaving observation, diagnosis and approved remediation fully
# working:
#
#   kubectl delete -k deploy/rbac/chaos
#
# That is the out-of-process kill switch for chaos specifically, and it is
# independent of the two in-process ones (the per-cluster eligibility marker in the
# config, and kube.ExecuteMode). Any of the three closes the path on its own.
#
# It is a RoleBinding, not a ClusterRoleBinding, so the grant cannot follow the
# identity into another namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maklaude-chaos
  namespace: maklaude-chaos
  labels:
    app.kubernetes.io/name: maklaude
    app.kubernetes.io/component: chaos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maklaude-chaos
subjects:
  - kind: ServiceAccount
    name: maklaude-chaos
    namespace: maklaude
