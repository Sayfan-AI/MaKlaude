# The identity MaKlaude authenticates as when it deliberately breaks a cluster.
#
# This is the THIRD ServiceAccount, and the reason it is not the executor's is the
# same reason the executor's is not the observation account's: a mutating request
# should say what kind of act it was, in the API server's own audit log, without
# anyone having to correlate it against MaKlaude's logs.
#
#   system:serviceaccount:maklaude:maklaude           — reads. A mutating request
#                                                       from it is a bug or an
#                                                       intrusion.
#   system:serviceaccount:maklaude:maklaude-executor  — an approved remediation.
#   system:serviceaccount:maklaude:maklaude-chaos     — a deliberate experiment.
#
# Those are three different acts with three different blast radii, and an operator
# reading an audit log after an incident is asking exactly which one happened.
#
# The account lives in the `maklaude` namespace with its siblings — it is part of
# MaKlaude — while the Role bound to it is scoped to the `maklaude-chaos`
# namespace where experiment objects live.
#
# It carries no permissions on its own, and notably NOT the read-only ClusterRole
# the executor additionally gets: the chaos path re-reads only its own custom
# resources, never pods, deployments or nodes. Everything MaKlaude observes about
# a cluster it has broken, it observes through the read-only identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maklaude-chaos
  namespace: maklaude
  labels:
    app.kubernetes.io/name: maklaude
    app.kubernetes.io/component: chaos
