# The identity MaKlaude authenticates as when it executes an APPROVED action.
#
# It is deliberately a SECOND ServiceAccount rather than extra permissions on the
# observation account. The read path and the write path are separate types with
# separate transport guards in the code (kube.Client vs kube.Executor); making
# them separate identities on the wire means the same separation holds at the API
# server, where it can be seen in an audit log. A mutating request attributed to
# system:serviceaccount:maklaude:maklaude is, by construction, a bug or an
# intrusion — never normal operation.
#
# This account carries no permissions on its own. The bindings in this bundle
# give it the three mutating verbs of maklaude-write, plus the same reads the
# observation account has (an executor must re-read an object to evaluate its
# resourceVersion precondition).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maklaude-executor
  namespace: maklaude
  labels:
    app.kubernetes.io/name: maklaude
    app.kubernetes.io/component: rbac
