# Grants the maklaude-executor ServiceAccount the three mutating verbs of
# maklaude-write.
#
# This binding — and only this binding — is what makes any write possible at the
# API server. Deleting it revokes MaKlaude's ability to change anything while
# leaving the read/diagnose/propose path fully working, which is the cheapest
# possible kill switch and the one an operator can pull without touching
# MaKlaude's config or restarting it. (The in-process kill switch is
# kube.ExecuteMode; this is its out-of-process counterpart.)
#
# Its subject is the executor account, never the observation account, so applying
# this bundle grants system:serviceaccount:maklaude:maklaude exactly nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maklaude-write
  labels:
    app.kubernetes.io/name: maklaude
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: maklaude-write
subjects:
  - kind: ServiceAccount
    name: maklaude-executor
    namespace: maklaude
